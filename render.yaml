# Deploy automático no Render (https://render.com): "New +" → "Blueprint" → aponte para
# este repositório e o Render lê este arquivo sozinho.
#
# IMPORTANTE: o Render não tem runtime nativo para Java, então este serviço builda a
# partir do Dockerfile incluído na raiz do projeto (multi-stage: Maven builda o .jar,
# a imagem final só leva o JRE).
#
# IMPORTANTE (JDBC): passamos host/porta/nome do banco separados (em vez da
# connectionString pronta) porque o driver JDBC do Java exige o prefixo "jdbc:" na URL,
# que a connectionString do Render não inclui. A URL final é montada em
# application-prod.properties.
#
# Depois do primeiro deploy, ajuste as variáveis marcadas com "sync: false" no painel do Render.

databases:
  - name: meteora-db
    plan: free
    databaseName: meteora
    user: meteora

services:
  - type: web
    name: meteora-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: DATABASE_HOST
        fromDatabase:
          name: meteora-db
          property: host
      - key: DATABASE_PORT
        fromDatabase:
          name: meteora-db
          property: port
      - key: DATABASE_NAME
        fromDatabase:
          name: meteora-db
          property: database
      - key: DATABASE_USERNAME
        fromDatabase:
          name: meteora-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: meteora-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false # preencha com a URL do seu front-end no Vercel, ex.: https://seu-projeto.vercel.app
