# ============================================================
# Perfil padrao (desenvolvimento) - usa banco H2 em arquivo local
# Para producao, rode com: --spring.profiles.active=prod
# (ajuste application-prod.properties com as credenciais do Postgres)
# ============================================================

spring.application.name=meteora-backend

# ---- Banco de dados (H2, persistido em arquivo dentro de ./data) ----
spring.datasource.url=jdbc:h2:file:./data/meteora;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Console do H2 (util em dev: http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- JWT ----
# IMPORTANTE: troque este segredo antes de ir para producao (use uma variavel de ambiente)
app.jwt.secret=${JWT_SECRET:troque-este-segredo-por-uma-chave-forte-e-unica-em-producao-0123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---- CORS ----
# Origens permitidas para chamar a API, separadas por virgula.
# Em dev, ja libera localhost em portas comuns de servidor estatico (http.server, live-server, VS Code Live Server).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:5173,http://localhost:3000}

# ---- Servidor ----
server.port=${PORT:8080}

# ---- Paginacao padrao ----
spring.data.web.pageable.default-page-size=12
spring.data.web.pageable.max-page-size=50
