# ============================================================
# Perfil de producao - PostgreSQL
# Ative com: java -jar meteora-backend.jar --spring.profiles.active=prod
# Configure as variaveis de ambiente abaixo no seu servidor/container
# ============================================================

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/meteora}
spring.datasource.username=${DATABASE_USERNAME:meteora}
spring.datasource.password=${DATABASE_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# "validate" evita que a aplicacao altere o schema sozinha em producao;
# use uma ferramenta de migracao (Flyway/Liquibase) para versionar o schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.h2.console.enabled=false

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---- CORS ----
# OBRIGATORIO em producao: defina a variavel de ambiente CORS_ALLOWED_ORIGINS com o
# endereco real do seu GitHub Pages, ex.: https://seu-usuario.github.io
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

server.port=${PORT:8080}
