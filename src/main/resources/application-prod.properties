# ============================================================
# Perfil de producao - PostgreSQL
# Ative com: java -jar meteora-backend.jar --spring.profiles.active=prod
# Configure as variaveis de ambiente abaixo no seu servidor/container
# ============================================================

# IMPORTANTE: o Render (e a maioria dos provedores gerenciados) fornece a string de conexao
# no formato "postgresql://usuario:senha@host:porta/banco" - sem o prefixo "jdbc:" que o
# driver Java exige. Por isso montamos a URL JDBC a partir de host/porta/banco separados,
# em vez de usar a connection string pronta.
spring.datasource.url=jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:meteora}
spring.datasource.username=${DATABASE_USERNAME:meteora}
spring.datasource.password=${DATABASE_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# "update" cria/ajusta as tabelas automaticamente - ok para este projeto, que ainda nao usa
# Flyway/Liquibase. Se adicionar uma ferramenta de migracao no futuro, troque para "validate".
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.h2.console.enabled=false

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---- CORS ----
# OBRIGATORIO em producao: defina a variavel de ambiente CORS_ALLOWED_ORIGINS com o
# endereco real do seu front-end publicado, ex.: https://seu-projeto.vercel.app
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

server.port=${PORT:8080}

